<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile Designer Admin | American Pro</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="../images/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=boska@400,500,700&display=swap" rel="stylesheet" />
    <style>
      :root { --navy: #0e1f3a; --red: #b91c2c; --bg: #f4f1eb; --line: #e2ddd3; --muted: #5b6478; --font-body: 'Satoshi', system-ui, sans-serif; --font-display: 'Boska', Georgia, serif; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 500 15px/1.45 var(--font-body); color: var(--navy); background: var(--bg); }
      h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; letter-spacing: -0.01em; }
      button, input, select, textarea { font: inherit; color: inherit; }
      .top { background: var(--navy); color: #fff; }
      .top__in { max-width: 1400px; margin: 0 auto; padding: .75rem 1.25rem; display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
      .top img { height: 34px; width: auto; }
      .top h1 { font-size: 1.15rem; color: #fff; }
      .tabs { display: flex; gap: .25rem; margin-left: auto; flex-wrap: wrap; }
      .tab { background: transparent; border: 1px solid transparent; color: rgba(255,255,255,.8); padding: .45rem .8rem; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .85rem; }
      .tab:hover { color: #fff; border-color: rgba(255,255,255,.25); }
      .tab.is-on { background: #fff; color: var(--navy); }
      .tab .count { display: inline-block; min-width: 1.4em; padding: 0 .35em; border-radius: 999px; background: var(--red); color: #fff; font-size: .7rem; margin-left: .3rem; text-align: center; }
      .who { font-size: .8rem; color: rgba(255,255,255,.7); }
      main { max-width: 1400px; margin: 0 auto; padding: 1.25rem; }
      .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; }
      .bar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
      .bar h2 { font-size: 1.5rem; margin-right: auto; }
      .in { height: 38px; border: 1px solid #d9d2c4; border-radius: 8px; padding: 0 .7rem; background: #fff; }
      .btn { height: 38px; padding: 0 1rem; border-radius: 999px; border: 1px solid var(--navy); background: var(--navy); color: #fff; font-weight: 700; font-size: .82rem; cursor: pointer; white-space: nowrap; }
      .btn:hover { background: #1b3157; }
      .btn--ghost { background: #fff; color: var(--navy); border-color: #d9d2c4; }
      .btn--ghost:hover { background: var(--bg); }
      .btn--red { background: var(--red); border-color: var(--red); }
      .btn--red:hover { background: #9d1725; }
      .btn--danger { background: #fff; color: var(--red); border-color: #f0c6cb; }
      .btn--sm { height: 30px; padding: 0 .7rem; font-size: .76rem; }
      .btn:disabled { opacity: .6; cursor: progress; }
      table { width: 100%; border-collapse: collapse; font-size: .85rem; }
      th { text-align: left; font: 700 .68rem/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: .8rem .75rem; border-bottom: 1px solid var(--line); background: #fbfaf7; position: sticky; top: 0; }
      td { padding: .7rem .75rem; border-bottom: 1px solid #efebe3; vertical-align: middle; }
      tr.row { cursor: pointer; }
      tr.row:hover td { background: #fbfaf7; }
      tr.row.is-sel td { background: #eef1f6; }
      td small { display: block; color: var(--muted); font-size: .74rem; }
      .thumb { width: 92px; height: 48px; display: block; background: #fbfaf7; border: 1px solid #efebe3; border-radius: 6px; }
      .pill { display: inline-block; padding: .2rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 700; text-transform: capitalize; }
      .pill--new { background: #fde8ea; color: var(--red); }
      .pill--reviewing { background: #fff4d6; color: #8a5a00; }
      .pill--quoted { background: #e4ecfb; color: #1d4ed8; }
      .pill--won { background: #e2f5e8; color: #15803d; }
      .pill--lost { background: #eee; color: #555; }
      .pill--off { background: #eee; color: #555; }
      .pill--admin { background: var(--navy); color: #fff; }
      .split { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 1rem; align-items: start; }
      .table-wrap { overflow: auto; max-height: calc(100dvh - 190px); border-radius: 14px; }
      .detail { padding: 1.2rem; position: sticky; top: 1rem; max-height: calc(100dvh - 2rem); overflow: auto; }
      .detail h3 { font-size: 1.25rem; }
      .detail .preview { width: 100%; aspect-ratio: 16 / 10; background: #fbfaf7; border: 1px solid var(--line); border-radius: 10px; margin: .8rem 0; display: block; }
      .kv { display: grid; grid-template-columns: 120px 1fr; gap: .35rem .75rem; font-size: .84rem; margin: .6rem 0 1rem; }
      .kv dt { color: var(--muted); font-weight: 600; }
      .kv dd { margin: 0; word-break: break-word; }
      .kv a { color: var(--red); font-weight: 700; }
      .lbl { display: block; font: 700 .68rem/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--red); margin: 1rem 0 .45rem; }
      textarea.in { width: 100%; height: 90px; padding: .6rem .7rem; resize: vertical; }
      .btns { display: flex; gap: .4rem; flex-wrap: wrap; }
      .empty { padding: 3rem 1rem; text-align: center; color: var(--muted); }
      .msg { margin: .5rem 0; padding: .6rem .8rem; border-radius: 8px; background: #fbe9eb; color: #9d1725; font-size: .84rem; }
      .msg--ok { background: #e2f5e8; color: #14532d; }
      .temp { font: 700 1.05rem/1.2 ui-monospace, Menlo, monospace; background: #fff8e1; border: 1px dashed #c9a227; padding: .6rem .8rem; border-radius: 8px; display: inline-block; user-select: all; }
      .login { min-height: 100dvh; display: grid; place-items: center; padding: 1rem; background: var(--navy); }
      .login .card { width: min(420px, 100%); padding: 2rem 1.75rem; }
      .login img { height: 44px; margin-bottom: 1rem; }
      .login h1 { font-size: 1.6rem; margin-bottom: .3rem; }
      .login p { color: var(--muted); font-size: .88rem; margin: 0 0 1.2rem; }
      .f { display: grid; gap: .3rem; margin-bottom: .8rem; }
      .f span { font-size: .76rem; font-weight: 700; }
      .f .in { width: 100%; height: 44px; }
      .login .btn { width: 100%; height: 46px; margin-top: .3rem; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; margin-bottom: 1rem; }
      .stat { padding: .9rem 1rem; }
      .stat b { display: block; font: 700 1.6rem/1 var(--font-display); }
      .stat span { font-size: .74rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; }
      .sub { padding: 1rem 1.2rem; }
      .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .6rem; align-items: end; }
      @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } .detail { position: static; max-height: none; } .table-wrap { max-height: none; } }
      @media (max-width: 700px) { .hide-sm { display: none; } .tabs { margin-left: 0; } }
    </style>
  </head>
  <body>
    <div id="admin" data-api="https://dealerportal.ameridex.com/api/designer"></div>
    <noscript>The admin requires JavaScript.</noscript>
    <script src="../js/vendor/jspdf.umd.min.js" defer></script>
    <script src="../js/profile-engine.js?v=1" defer></script>
    <script src="../js/designer-admin.js?v=1" defer></script>
  </body>
</html>
